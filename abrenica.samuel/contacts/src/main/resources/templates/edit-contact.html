<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Contact</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    h2 {
      color: #6B8E23;
    }
    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #6B8E23;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #8FBC8F;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #6B8E23;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h2>Edit Contact</h2>

<form action="/update-contact" method="post">
    <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />

    <label for="givenName">First Name:</label>
    <input type="text" id="givenName" name="givenName"
           th:value="${contact.names != null and #lists.size(contact.names) > 0 ? contact.names[0].givenName : ''}" />

    <label for="familyName">Last Name:</label>
    <input type="text" id="familyName" name="familyName"
           th:value="${contact.names != null and #lists.size(contact.names) > 0 ? contact.names[0].familyName : ''}" />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           th:value="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0 ? contact.emailAddresses[0].value : ''}" />

    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone"
           th:value="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0 ? contact.phoneNumbers[0].value : ''}" />

    <button type="submit">Update Contact</button>
</form>

<a href="/contacts">Back to Contacts</a>

</body>
</html>
