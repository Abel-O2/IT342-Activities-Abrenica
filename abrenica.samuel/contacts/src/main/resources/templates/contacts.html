<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contacts List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #6B8E23; /* Muted green color */
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .no-data {
            color: gray;
            font-style: italic;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .actions button {
            padding: 6px 12px;
            cursor: pointer;
        }
        .edit-btn {
            background-color: #8FBC8F; /* A lighter muted green for the edit button */
            border: none;
            color: white;
        }
        .delete-btn {
            background-color: #dc3545;
            border: none;
            color: white;
        }
        .add-contact-btn {
            background-color: #6B8E23;
            border: none;
            color: white;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Contact List</h2>

<form action="/add-contact" method="get" style="margin-top: 20px; margin-bottom: 20px;">
    <button type="submit" class="add-contact-btn">Add Contact</button>
</form>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Email Address</th>
        <th>Phone Number</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="contact : ${contacts}">
        <td th:text="${contact.names != null and #lists.size(contact.names) > 0 ? contact.names[0].displayName : 'No name'}"></td>
        <td>
            <span th:if="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0}"
                  th:text="${contact.emailAddresses[0].value}"></span>
            <span th:unless="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0}" class="no-data">No email</span>
        </td>
        <td>
            <span th:if="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0}"
                  th:text="${contact.phoneNumbers[0].value}"></span>
            <span th:unless="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0}" class="no-data">No phone</span>
        </td>
        <td class="actions">
            <form th:action="@{/edit-contact}" method="get" style="margin: 0;">
                <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
                <button type="submit" class="edit-btn">Edit</button>
            </form>

            <form th:action="@{/delete-contact}" method="post" style="margin: 0;">
                <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
                <button type="submit" class="delete-btn" onclick="return confirm('DELETE the contact?');">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div style="padding-top: 20px;">
    <form action="/logout" method="post">
        <button type="submit" class="add-contact-btn">Logout</button>
    </form>
</div>

</body>
</html>
